<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Math — LUBILUBIJBI's Servers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#150E0B; --bg-panel:#1F1512; --border:#3A241A;
    --ember:#FF6A2B; --ember-soft:#FF8A4C; --crimson:#B23A2E;
    --text:#F2E6DC; --text-dim:#B8A79A; --red:#E8756A;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:'Inter', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .panel{
    background:var(--bg-panel); border:1px solid var(--border); border-radius:10px;
    padding:36px; max-width:400px; width:100%; text-align:center;
  }
  h1{font-family:'Rajdhani', sans-serif; font-weight:700; font-size:22px; margin-bottom:8px;}
  p.sub{color:var(--text-dim); font-size:13px; margin-bottom:24px;}
  #question{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:36px;
    color:var(--ember-soft); margin-bottom:22px;
  }
  input[type="number"]{
    width:100%; background:var(--bg); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:'JetBrains Mono', monospace; font-size:20px; text-align:center;
    padding:12px; margin-bottom:16px;
  }
  input[type="number"]:focus{outline:none; border-color:var(--ember);}
  button{
    width:100%; font-family:'Rajdhani', sans-serif; font-weight:700; font-size:16px;
    padding:13px 20px; border-radius:6px; cursor:pointer; border:none;
    background:linear-gradient(90deg, var(--ember), var(--crimson)); color:#180B08;
  }
  .status{margin-top:16px; font-size:14px; display:none;}
  .status.err{display:block; color:var(--red);}
  .back-link{
    display:inline-block; margin-top:24px; color:var(--text-dim); text-decoration:none;
    font-family:'JetBrains Mono', monospace; font-size:12px;
  }
  .back-link:hover{color:var(--ember-soft);}
</style>
</head>
<body>

<div class="panel">
  <h1>Quick Math</h1>
  <p class="sub">Solve this to continue.</p>

  <div id="question">? × ? = ?</div>

  <form id="mathForm">
    <input type="number" id="answerInput" placeholder="Your answer" autocomplete="off" required>
    <button type="submit">Submit</button>
  </form>

  <div class="status err" id="status"></div>

  <a class="back-link" href="../">&larr; Back to Secret Code</a>
</div>

<script>
  const a = Math.floor(Math.random() * 9) + 1;
  const b = Math.floor(Math.random() * 9) + 1;
  const correctAnswer = a * b;

  document.getElementById('question').textContent = `${a} × ${b} = ?`;

  const form = document.getElementById('mathForm');
  const input = document.getElementById('answerInput');
  const status = document.getElementById('status');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const answer = parseInt(input.value, 10);

    if(answer === correctAnswer){
      window.location.href = '../rr/';
    } else {
      status.textContent = "Enter this code on the Secret Code page: QW";
      status.style.display = 'block';
    }
  });
</script>

</body>
</html>
