<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>黑屏</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
    cursor: none;               /* 隐藏鼠标指针，避免白箭头破坏纯黑 */
    overscroll-behavior: none;  /* 防止手机上拉出白底回弹 */
  }
  /* 纯黑覆盖层，铺满整个视口，处理各种边角和刘海 */
  #black {
    position: fixed;
    inset: 0;
    background: #000000;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
  <div id="black"></div>
  <script>
    // 页面获得焦点时不让方向键/空格滚动（body 已 overflow:hidden，双保险）
    window.addEventListener('keydown', function (e) {
      if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', 'Home', 'End'].indexOf(e.key) !== -1) {
        e.preventDefault();
      }
    }, { passive: false });

    // 手机/触屏：双击进入全屏（F11 由浏览器原生处理，网页无需干预）
    document.addEventListener('dblclick', function () {
      var el = document.documentElement;
      if (!document.fullscreenElement) {
        if (el.requestFullscreen) el.requestFullscreen();
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    });
  </script>
</body>
</html>
