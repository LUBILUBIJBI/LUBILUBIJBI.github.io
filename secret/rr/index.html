<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>
<style>
  *{margin:0; padding:0; box-sizing:border-box;}
  html, body{
    width:100%; height:100%; overflow:hidden;
    background:#0d0d0d; font-family:'Comic Sans MS', 'Comic Sans', cursive, sans-serif;
  }

  #gate{
    position:fixed; inset:0; z-index:10;
    background:#0d0d0d; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:26px; padding:24px;
  }
  #gate h1{color:#eee; font-size:22px; text-align:center; max-width:360px; font-family:sans-serif; font-weight:600;}
  #claimBtn{
    font-family:sans-serif; font-weight:700; font-size:20px;
    padding:16px 40px; border-radius:10px; border:none; cursor:pointer;
    background:linear-gradient(90deg,#FFD700,#FFA500); color:#1a1a1a;
    box-shadow:0 0 30px rgba(255,215,0,.5);
    animation:pulseBtn 1.2s ease-in-out infinite;
  }
  @keyframes pulseBtn{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.06);}
  }
  #gate.hidden{display:none;}

  #reveal{
    position:fixed; inset:0; display:none;
    align-items:center; justify-content:center;
    background:linear-gradient(45deg,#ff0080,#7928ff,#00d4ff,#ff0080);
    background-size:400% 400%;
  }
  .revealed #reveal{display:flex; animation:bgShift 3s ease infinite;}
  @keyframes bgShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  #revealText{
    color:#fff; text-align:center; font-size:9vw; line-height:1.15;
    text-shadow:0 0 20px rgba(0,0,0,.5), 4px 4px 0 rgba(0,0,0,.3);
    transform:scale(0.3); opacity:0;
    animation:popIn 0.5s cubic-bezier(.2,1.6,.4,1) forwards, wiggle 0.6s ease-in-out infinite 0.5s;
    padding:0 20px;
  }
  @keyframes popIn{
    0%{transform:scale(0.3); opacity:0;}
    70%{transform:scale(1.15); opacity:1;}
    100%{transform:scale(1); opacity:1;}
  }
  @keyframes wiggle{
    0%,100%{transform:rotate(-2deg);}
    50%{transform:rotate(2deg);}
  }

  #back{
    position:fixed; top:16px; left:16px; color:#3a3a3a; text-decoration:none;
    font-family:monospace; font-size:12px; opacity:.5; z-index:20;
  }
</style>
</head>
