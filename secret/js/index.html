<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>...</title>
<style>
  *{margin:0; padding:0; box-sizing:border-box;}
  html, body{
    width:100%; height:100%; overflow:hidden;
    background:#000; cursor:pointer;
  }
  #flash{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#000;
  }
  #face{
    font-size:55vh; line-height:1;
    filter:contrast(1.4) saturate(1.6);
    transform:scale(0.5);
    opacity:0;
  }
  .jumpscare #flash{ animation:strobe 0.08s steps(1) 8; }
  .jumpscare #face{ animation:zoomIn 0.35s cubic-bezier(.2,1.5,.5,1) forwards, shake 0.12s linear infinite; }
  @keyframes strobe{
    0%{background:#000;}
    50%{background:#ff0000;}
    100%{background:#000;}
  }
  @keyframes zoomIn{
    0%{transform:scale(0.3); opacity:0;}
    60%{transform:scale(1.35); opacity:1;}
    100%{transform:scale(1.1); opacity:1;}
  }
  @keyframes shake{
    0%{margin-left:0; margin-top:0;}
    25%{margin-left:-14px; margin-top:8px;}
    50%{margin-left:12px; margin-top:-10px;}
    75%{margin-left:-8px; margin-top:-6px;}
    100%{margin-left:0; margin-top:0;}
  }
  #hint{
    position:fixed; bottom:24px; left:0; right:0; text-align:center;
    color:#3a3a3a; font-family:monospace; font-size:11px; letter-spacing:.1em;
    opacity:.5;
  }
  #back{
    position:fixed; top:16px; left:16px; color:#3a3a3a; text-decoration:none;
    font-family:monospace; font-size:12px; opacity:.5;
  }

  #gate{
    position:fixed; inset:0; z-index:10;
    background:#000; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:28px; padding:24px;
  }
  #gate h1{
    color:#ddd; font-family:sans-serif; font-weight:600; font-size:22px;
    text-align:center; max-width:360px;
  }
  #gate .btn-row{display:flex; gap:16px;}
  #gate button{
    font-family:sans-serif; font-weight:600; font-size:16px;
    padding:12px 32px; border-radius:8px; border:1px solid #444; cursor:pointer;
    background:#111; color:#ddd;
  }
  #gate button:hover{border-color:#888;}
  #gate.hidden{display:none;}
</style>
</head>
<body>

<div id="gate">
  <h1>Are you ready for the cinema?</h1>
  <div class="btn-row">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
  </div>
</div>

<div id="flash">

</div>

<a id="back" href="../../">&larr; back</a>
<div id="hint">tap anywhere</div>

<script>
  let played = false;
  const audio = document.getElementById('screamAudio');
  audio.volume = 1;

  function showJumpscare(){
    document.body.classList.add('jumpscare');
    document.getElementById('hint').style.display = 'none';
  }

  function attemptPlay(){
    if(played) return;
    audio.currentTime = 0;
    const p = audio.play();
    if(p !== undefined){
      p.then(() => { played = true; })
       .catch(() => { /* still blocked - keep listening for another gesture */ });
    } else {
      played = true;
    }
  }

  function gestureHandler(){
    attemptPlay();
    if(played){
      document.removeEventListener('pointerdown', gestureHandler);
      document.removeEventListener('click', gestureHandler);
      document.removeEventListener('touchend', gestureHandler);
      document.removeEventListener('keydown', gestureHandler);
    }
  }

  function enterCinema(){
    // audio.play() is called synchronously inside this click handler,
    // which every browser (including iOS Safari) counts as a valid user gesture.
    attemptPlay();
    document.getElementById('gate').classList.add('hidden');
    showJumpscare();
  }

  document.getElementById('yesBtn').addEventListener('click', enterCinema);
  // "No" doesn't save you - it triggers the exact same thing.
  document.getElementById('noBtn').addEventListener('click', enterCinema);

  // Extra safety net: keep retrying on any further tap/click/key
  // in case the very first attempt still somehow got blocked.
  document.addEventListener('pointerdown', gestureHandler);
  document.addEventListener('click', gestureHandler);
  document.addEventListener('touchend', gestureHandler);
  document.addEventListener('keydown', gestureHandler);
</script>
