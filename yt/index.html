    min-height:100vh; padding:40px 20px 60px;
    display:flex; flex-direction:column; align-items:center;
  }
  .back-link{
    align-self:flex-start; color:var(--text-dim); text-decoration:none;
    font-family:'JetBrains Mono', monospace; font-size:13px; margin-bottom:34px;
  }
  .back-link:hover{color:var(--ember-soft);}
  h1{
    font-family:'Rajdhani', sans-serif; font-weight:700; font-size:34px; text-align:center; margin-bottom:8px;
    background:linear-gradient(90deg, var(--ember-soft), var(--glow), var(--ember));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  p.sub{color:var(--text-dim); font-size:15px; text-align:center; max-width:420px; margin-bottom:38px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:20px; width:100%; max-width:640px;}
  .card{
    background:var(--bg-panel); border:1px solid var(--border); border-radius:14px;
    padding:30px 22px 26px; text-align:center;
    display:flex; flex-direction:column; align-items:center;
    transition:border-color .15s, transform .15s, box-shadow .15s;
  }
  .card:hover{border-color:var(--ember); transform:translateY(-3px); box-shadow:0 0 24px rgba(255,106,43,.25);}
  .avatar{
    width:120px; height:120px; border-radius:50%; object-fit:cover;
    border:2px solid var(--border); box-shadow:0 0 22px rgba(255,106,43,.3); margin-bottom:18px;
  }
  .role{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ember-soft); border:1px solid rgba(255,106,43,.35); background:rgba(255,106,43,.1);
    border-radius:4px; padding:3px 9px; margin-bottom:12px;
  }
  .card h2{font-family:'Rajdhani', sans-serif; font-weight:700; font-size:26px; margin-bottom:4px;}
  .handle{font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--text-dim); margin-bottom:22px;}
  .sub-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
    font-family:'Rajdhani', sans-serif; font-weight:700; font-size:18px; text-decoration:none;
    padding:13px 20px; border-radius:8px; color:#180B08;
    background:linear-gradient(90deg, var(--ember), var(--crimson));
    box-shadow:0 6px 20px rgba(255,106,43,.25);
  }
  .sub-btn:hover{box-shadow:0 6px 28px rgba(255,106,43,.5);}
  @media (prefers-reduced-motion:no-preference){
    .card{animation:rise .5s ease both;}
    .card:nth-child(2){animation-delay:.12s;}
    @keyframes rise{from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:none;}}
  }
</style>
</head>

  document.documentElement.dir = (lang === 'ar' || lang === 'ur') ? 'rtl' : 'ltr';
  document.getElementById('backLink').textContent = t.back;
  document.getElementById('pageTitle').textContent = t.title;
  document.getElementById('pageSub').textContent = t.sub;
  document.getElementById('roleMain').textContent = t.main;
  document.getElementById('roleMemes').textContent = t.memes;
  document.querySelectorAll('.btnText').forEach(el => el.textContent = t.btn);
</script>

</body>
</html>
